name: Build Package

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build OTF package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge python3-fonttools make python3 unzip zip

      - name: Resolve package name
        run: |
          version="$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' build_snu_sprout.py)"
          test -n "$version"
          echo "PACKAGE_ZIP=dist/SNUSprout-${version}.zip" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: make test

      - name: Build package
        run: make package

      - name: Verify package
        run: |
          test "$(find instance_otf -maxdepth 1 -name 'SNUSprout-*.otf' | wc -l)" -eq 12
          test -f "$PACKAGE_ZIP"
          unzip -l "$PACKAGE_ZIP"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: SNUSprout-${{ github.sha }}
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: SNUSprout-${{ github.sha }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/SNUSprout-*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
